[package]
name = "tarcsweb"
version = "0.18.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "=4.19.0"
gtk = "0.18.2"
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKSecurityOrigin", "WKUIDelegate"] }

[profile.dev]
debug = 0
