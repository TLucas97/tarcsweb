name: Tauri desktop bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to (empty builds artifacts only)
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundling libraries
        if: runner.os == 'Linux'
        # The runner ships libunwind-14-dev, which blocks the libunwind-dev that GStreamer's headers need.
        run: sudo apt-get update && sudo apt-get remove -y libunwind-14-dev && sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Install JavaScript dependencies in the CI checkout
        run: pnpm install --frozen-lockfile
      # Fetches the Node sidecar, stages the app and bundles; the AppImage needs its repack step.
      - name: Build desktop bundles
        run: node scripts/tauri/build.mjs ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage release asset
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        run: |
          mkdir -p release-assets
          case '${{ matrix.target }}' in
            x86_64-unknown-linux-gnu)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-assets/tarcsweb-linux-x64.AppImage
              cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig release-assets/tarcsweb-linux-x64.AppImage.sig ;;
            x86_64-pc-windows-msvc)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release-assets/tarcsweb-windows-x64.exe
              cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig release-assets/tarcsweb-windows-x64.exe.sig ;;
            aarch64-apple-darwin)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/tarcsweb-macos-arm64.dmg
              cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz release-assets/tarcsweb-macos-arm64.app.tar.gz
              cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig release-assets/tarcsweb-macos-arm64.app.tar.gz.sig ;;
            x86_64-apple-darwin)
              cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/tarcsweb-macos-x64.dmg
              cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz release-assets/tarcsweb-macos-x64.app.tar.gz
              cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig release-assets/tarcsweb-macos-x64.app.tar.gz.sig ;;
          esac
      # Each platform uploads its own installer as soon as it is built, so a slow one does not hold the others back.
      - name: Upload to the GitHub release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: tarcsweb-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig

  updater:
    needs: bundle
    if: always() && (github.event_name == 'release' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Build and upload updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p updater-assets
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir updater-assets
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > updater-assets/assets.txt
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const assets = new Set(readFileSync('updater-assets/assets.txt', 'utf8').trim().split('\n'));
          const platforms = {};
          for (const [platform, asset] of [
            ['linux-x86_64', 'tarcsweb-linux-x64.AppImage'],
            ['windows-x86_64', 'tarcsweb-windows-x64.exe'],
            ['darwin-aarch64', 'tarcsweb-macos-arm64.app.tar.gz'],
            ['darwin-x86_64', 'tarcsweb-macos-x64.app.tar.gz'],
          ]) {
            const signature = `updater-assets/${asset}.sig`;
            if (!assets.has(asset) || !existsSync(signature)) continue;
            platforms[platform] = {
              signature: readFileSync(signature, 'utf8').trim(),
              url: `https://github.com/TLucas97/tarcsweb/releases/download/${encodeURIComponent(tag)}/${asset}`,
            };
          }
          if (!Object.keys(platforms).length) throw new Error('No signed updater artifacts are available');
          writeFileSync('latest.json', JSON.stringify({ version: tag.replace(/^v/, ''), notes: '', platforms }, null, 2));
          NODE
          gh release upload "$RELEASE_TAG" latest.json --clobber
