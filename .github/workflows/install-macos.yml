# Runs the installer, the in-app updater script and the uninstaller on macOS and Linux runners.
# Services are skipped (TARCSWEB_NO_SYSTEMD=1) except in a best-effort launchd job on macOS.
name: install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - get.sh
      - scripts/**
      - server/update.ts
      - .github/workflows/install-macos.yml

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARCSWEB_NO_SYSTEMD: '1'
      TW_HOME: ${{ github.workspace }}/../tw-home
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Shell versions
        run: |
          /bin/bash --version | head -n 1
          bash --version | head -n 1

      - name: Syntax check with the system bash (3.2 on macOS)
        run: for f in install.sh get.sh scripts/*.sh; do /bin/bash -n "$f"; done

      - name: get.sh runs under the system bash
        run: /bin/bash get.sh --help

      - name: Install from the working copy (source mode)
        run: /bin/bash ./install.sh < /dev/null

      # Lays out a release dir the way get.sh does, without the GitHub API.
      - name: Install as a release (release mode)
        run: |
          stage() {
            mkdir -p "$TW_HOME/releases/$1"
            tar --exclude=./node_modules --exclude=./.git -cf - . | tar -xf - -C "$TW_HOME/releases/$1"
            printf '%s\n' "$1" > "$TW_HOME/releases/$1/.tarcsweb-release"
          }
          stage v0.0.1-ci
          /bin/bash "$TW_HOME/releases/v0.0.1-ci/install.sh" < /dev/null
          test "$(readlink "$TW_HOME/current")" = releases/v0.0.1-ci
          stage v0.0.2-ci
          /bin/bash "$TW_HOME/releases/v0.0.2-ci/install.sh" < /dev/null
          # The second swap replaces an existing link, the case BSD mv needs -h for.
          test "$(readlink "$TW_HOME/current")" = releases/v0.0.2-ci
          test -d "$TW_HOME/releases/v0.0.1-ci"

      - name: Boot-check the installed release
        run: |
          cd "$TW_HOME/current"
          CW_PORT=8798 CW_DIST="$PWD/dist" CW_ORIGINS=http://127.0.0.1:8798 node server/index.ts > "$RUNNER_TEMP/boot.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8798/; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" || true
          cat "$RUNNER_TEMP/boot.log"
          test "$ok" = 1

      # A fake release API on localhost: get.sh reads tag_name and tarball_url from it.
      - name: Self-update to a third release
        run: |
          srv="$RUNNER_TEMP/srv"
          mkdir -p "$srv/repos/TLucas97/tarcsweb/releases/tags" "$RUNNER_TEMP/pkg/tarcsweb-ci"
          tar --exclude=./node_modules --exclude=./.git -cf - . | tar -xf - -C "$RUNNER_TEMP/pkg/tarcsweb-ci"
          tar -czf "$srv/src.tar.gz" -C "$RUNNER_TEMP/pkg" tarcsweb-ci
          printf '{"tag_name": "v0.0.3-ci", "tarball_url": "http://127.0.0.1:8790/src.tar.gz"}\n' > "$srv/repos/TLucas97/tarcsweb/releases/tags/v0.0.3-ci"
          python3 -m http.server 8790 --bind 127.0.0.1 --directory "$srv" > /dev/null 2>&1 &
          http_pid=$!
          sleep 2
          logs="$RUNNER_TEMP/update-logs"
          # The server spawns the script by its real path, so HOME_DIR resolves through releases/<tag>.
          script="$(cd "$TW_HOME/current" && pwd -P)/scripts/self-update.sh"
          code=0
          TARCSWEB_API=http://127.0.0.1:8790 TARCSWEB_LOG_DIR="$logs" /bin/bash "$script" v0.0.3-ci || code=$?
          kill "$http_pid" || true
          cat "$logs/update.log"
          test "$code" = 0
          test "$(cut -f1 "$logs/update-state")" = done
          test "$(readlink "$TW_HOME/current")" = releases/v0.0.3-ci
          test ! -e "$TW_HOME/.update.lock.d"

      - name: Uninstall
        run: |
          /bin/bash "$TW_HOME/current/scripts/uninstall.sh" --purge
          test ! -e "$TW_HOME"

  # The runner has a logged-in GUI session, so the real launchd agent can load. Best effort until it has run green.
  launchd:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      TARCSWEB_PORT: '8798'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install with the launchd agent
        run: |
          home="$HOME/.local/share/tarcsweb"
          mkdir -p "$home/releases/v0.0.1-ci"
          tar --exclude=./node_modules --exclude=./.git -cf - . | tar -xf - -C "$home/releases/v0.0.1-ci"
          echo v0.0.1-ci > "$home/releases/v0.0.1-ci/.tarcsweb-release"
          SSH_CONNECTION=ci /bin/bash "$home/releases/v0.0.1-ci/install.sh" < /dev/null

      - name: Agent is running and restarts
        run: |
          target="gui/$(id -u)/io.github.tlucas97.tarcsweb"
          launchctl print "$target" | grep 'state = running'
          launchctl kickstart -k "$target"
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8798/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8798/
          "$HOME/.local/bin/tarcsweb" || true
          test -x "$HOME/Applications/tarcsweb.app/Contents/MacOS/tarcsweb"

      - name: Logs
        if: always()
        run: cat "$HOME/Library/Logs/tarcsweb/tarcsweb.log" || true

      - name: Uninstall
        run: |
          /bin/bash "$HOME/.local/share/tarcsweb/current/scripts/uninstall.sh" --purge
          if launchctl print "gui/$(id -u)/io.github.tlucas97.tarcsweb" > /dev/null 2>&1; then exit 1; fi
          test ! -e "$HOME/Library/LaunchAgents/io.github.tlucas97.tarcsweb.plist"
          test ! -e "$HOME/Applications/tarcsweb.app"
