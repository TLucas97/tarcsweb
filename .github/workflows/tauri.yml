name: Tauri desktop bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to (empty builds artifacts only)
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundling libraries
        if: runner.os == 'Linux'
        # The runner ships libunwind-14-dev, which blocks the libunwind-dev that GStreamer's headers need.
        run: sudo apt-get update && sudo apt-get remove -y libunwind-14-dev && sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Install JavaScript dependencies in the CI checkout
        run: pnpm install --frozen-lockfile
      # Fetches the Node sidecar, stages the app and bundles; the AppImage needs its repack step.
      - name: Build desktop bundles
        run: node scripts/tauri/build.mjs ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stage release asset
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        run: |
          mkdir -p release-assets
          case '${{ matrix.target }}' in
            x86_64-unknown-linux-gnu) cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-assets/tarcsweb-linux-x64.AppImage ;;
            x86_64-pc-windows-msvc) cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe release-assets/tarcsweb-windows-x64.exe ;;
            aarch64-apple-darwin) cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/tarcsweb-macos-arm64.dmg ;;
            x86_64-apple-darwin) cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/tarcsweb-macos-x64.dmg ;;
          esac
      # Each platform uploads its own installer as soon as it is built, so a slow one does not hold the others back.
      - name: Upload to the GitHub release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: tarcsweb-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
